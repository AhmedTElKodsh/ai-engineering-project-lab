[project]
name = "ai-engineering-project-lab"
version = "0.1.0"
description = "Guided, project-first practice for production AI engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["projects", "tests", "from-scratch/scripts/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Frozen upstream-derived lesson copies keep the curriculum's own style.
extend-exclude = ["from-scratch/lessons"]

[tool.ruff.lint.per-file-ignores]
# The resolver reports every schema problem as ValueError (callers and tests rely on it)
# and schedules by the learner's local calendar date.
"from-scratch/scripts/**" = ["TRY004", "DTZ011"]
